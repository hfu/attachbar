<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>attachbar – MGRS pmtiles example (M1)</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      #wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      /* Sidebar dimensions — keep in sync with createAttachbar sidebar height/width */
      .attachbar-sidebar--top {
        height: 32px;
        background: rgba(255, 255, 255, 0.85);
        border-bottom: 1px solid #ccc;
        font-size: 11px;
        font-family: monospace;
      }

      .attachbar-sidebar--left {
        width: 48px;
        background: rgba(255, 255, 255, 0.85);
        border-right: 1px solid #ccc;
        font-size: 11px;
        font-family: monospace;
      }

      .attachbar-label {
        white-space: nowrap;
        color: #333;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
